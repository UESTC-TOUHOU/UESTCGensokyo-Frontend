server {
    listen 80;
    listen 8443; # plain HTTP — matches compose port mapping 443:8443
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static assets: cache and return 404 if missing (do not fallback to index.html)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|ani|svg|woff|woff2|ttf|eot|webp|wav|ogg|mp3)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # SPA routing fallback: non-asset routes fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
