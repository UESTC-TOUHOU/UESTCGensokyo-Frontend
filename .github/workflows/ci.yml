name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout touhou-web-engine
        uses: actions/checkout@v4
        with:
          repository: wray-lee/touhou-web-engine
          ref: f062be7f0700e3bd4b15a007b6521feee27d6460
          path: touhou-web-engine

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build touhou-web-engine
        run: cd ./touhou-web-engine && bun install --frozen-lockfile && bun run build

      - name: Link engine locally
        run: |
          cd ./touhou-web-engine && bun link
          cd .. && bun link @uestc-touhou/touhou-web-engine

      - name: Copy engine assets
        run: mkdir -p public/th08-assets && cp -r ./touhou-web-engine/dist/* public/th08-assets/

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build root
        run: bun run build

      - name: Build Pages (gh-pages base)
        run: bun run build --config vite.config\(gh-pages\).ts

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: gh-pages-dist
          path: ./dist
          retention-days: 1

  # 部署：main 分支 push 后自动发布到 GitHub Pages（gh-pages 分支）。
  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: gh-pages-dist
          path: ./dist

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  docker:
    name: Build and verify/push Docker image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout touhou-web-engine
        uses: actions/checkout@v4
        with:
          repository: wray-lee/touhou-web-engine
          ref: f062be7f0700e3bd4b15a007b6521feee27d6460
          path: touhou-web-engine

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Notify deployment webhook
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "::warning::DEPLOY_WEBHOOK_URL is not configured. Image published, server rollout not verified; secret not configured."
            echo "image published, server rollout not verified; secret not configured" >> $GITHUB_STEP_SUMMARY
          else
            echo "Triggering server deployment webhook..."
            if curl --fail --silent --show-error --output /dev/null --stderr /dev/null --max-time 30 -X POST "$DEPLOY_WEBHOOK_URL"; then
              echo "Deployment webhook accepted."
              echo "deployment webhook accepted; server rollout not verified" >> $GITHUB_STEP_SUMMARY
            else
              status=$?
              echo "Deployment webhook request failed with exit code $status" >&2
              exit "$status"
            fi
          fi
