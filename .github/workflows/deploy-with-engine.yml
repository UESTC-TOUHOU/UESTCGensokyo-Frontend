name: Deploy with Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout touhou-web-engine
        uses: actions/checkout@v4
        with:
          repository: wray-lee/touhou-web-engine
          path: touhou-web-engine

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build touhou-web-engine
        run: cd ./touhou-web-engine && bun install && bun run build

      - name: Copy engine assets
        run: mkdir -p public/th08-assets && cp -r ./touhou-web-engine/dist/* public/th08-assets/

      - name: Build frontend
        run: bun install && bun run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Notify deployment webhook
        run: curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
